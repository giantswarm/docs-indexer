name: docs-indexer-app
namespace: docs
image:
  registry: gsoci.azurecr.io
  name: docs-indexer
  tag: ""
opensearchEndpoint: "http://sitesearch-app:9200/"

resources:
  requests:
    cpu: 100m
    memory: 80M
    # -- Ephemeral storage request. The `docs-cache` `emptyDir` holds a full git
    # clone of the indexed repository, so this has to cover the largest one.
    ephemeralStorage: 512Mi
  limits:
    cpu: 200m
    memory: 200M
    # -- Ephemeral storage limit. Exceeding it evicts the pod mid-run, so this
    # leaves room for the indexed repositories to grow.
    ephemeralStorage: 2Gi

credentials:
  githubAccessToken: DUMMYTOKEN
  hubspotAccessToken: DUMMYTOKEN

# @schema enum:["", amd64, arm64]
# -- Target CPU architecture for the indexer jobs. Empty imposes no constraint.
# `arm64` pins them to arm64 nodes, adding both the `kubernetes.io/arch` node
# selector and the toleration for the `kubernetes.io/arch=arm64:NoSchedule`
# taint that Giant Swarm arm64 node pools carry. Both are required, so this
# single value sets both.
architecture: ""

# @schema type:object;additionalProperties:{"type":"string"}
# -- Node selector for the indexer jobs. Merged with `architecture`. Pinning to
# arm64 here rather than through `architecture` also adds the arm64 taint
# toleration, so either route is safe. A value that contradicts `architecture`
# fails the render.
nodeSelector: {}

# @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration
# -- Tolerations for the indexer jobs. Merged with the toleration that
# `architecture: arm64` adds.
tolerations: []
