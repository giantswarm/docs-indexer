# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests) for the
# docs-indexer-app chart. The job creates a kind cluster; ATS applies the
# manifests listed below, installs the packaged chart with
# `helm upgrade --install --wait` (tests/test-values.yaml, the namespace below)
# and runs `pytest -m smoke` in tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check: the
# chart, including its pre-install PolicyException hooks, installs on a bare
# cluster and the four indexer CronJobs exist, scheduled and not suspended. The
# CronJobs are never run here: they index into the operations cluster's search
# backend, which the kind cluster does not have. The indexer image itself is
# covered by the Python unit tests (build-and-test) and the build-image job.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: docs-indexer

# Manifests applied before the install. ATS passes the value to one
# `kubectl apply --server-side -f`, so a comma-separated list works: ATS's
# bundled CRDs (/etc/ats/crds) plus tests/ats/cluster-prerequisites, the
# policy.giantswarm.io PolicyException CRD (vendored from
# kyverno-policy-operator) and the `policy-exceptions` namespace the hooks
# render into.
cluster-crds: /etc/ats/crds,tests/ats/cluster-prerequisites

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up.
skip-steps: [functional, upgrade]
