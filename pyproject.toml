[project]
name = "docs-indexer"
version = "0.1.0"
description = "Search content indexer for Giant Swarm's search engines"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "chardet==7.6.0",
    "click==8.4.2",
    "opensearch-py==3.2.0",
    "GitPython==3.1.59",
    "idna==3.19",
    "Markdown==3.10.3",
    "prance==26.7.19.0",
    "requests==2.34.2",
    "semver==3.0.4",
    "six==1.17.0",
    "soupsieve==2.9.2",
    "urllib3==2.7.0",
    "PyYAML==6.0.3",
]

[tool.uv]
# This is an application, not a library, so we don't need to build it
package = false
